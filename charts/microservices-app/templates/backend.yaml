apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          args: null
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: DB_HOST
              value: postgres-svc
            - name: DB_NAME
              value: {{ .Values.database.dbName | quote }}
            - name: DB_USER
              value: {{ .Values.database.dbUser | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.database.dbPassword | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: backend-api
  ports:
    - port: 80
      targetPort: {{ .Values.backend.port }}
