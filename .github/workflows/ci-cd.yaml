name: Build, Push to ECR & Update GitOps Manifest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yaml"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push FastAPI Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/aws-k8s-backend:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/aws-k8s-backend:$IMAGE_TAG
          sed -i "s|image: .*aws-k8s-backend:.*|image: $ECR_REGISTRY/aws-k8s-backend:$IMAGE_TAG|" charts/microservices-app/values.yaml

      - name: Commit Updated Image Tag for Argo CD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/microservices-app/values.yaml
          git commit -m "chore(gitops): deploy image sha-${{ github.sha }}" || exit 0
          git push
